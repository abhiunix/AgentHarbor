name: Feature request
description: Suggest a new capability, provider, or improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow gap, not just the feature. "I'm always frustrated when…"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like AgentHarbor to do.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Related provider (if any)
      multiple: true
      options:
        - Claude Code
        - Cursor
        - Codex (OpenAI)
        - Gemini CLI
        - Windsurf
        - New provider (name it below)
        - Not provider-specific
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Alternatives you've considered, links, screenshots.

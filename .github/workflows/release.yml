name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      changelog: ${{ steps.changelog.outputs.body }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          FEATS=""
          FIXES=""
          if [ -n "$PREV_TAG" ]; then
            FEATS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s" --no-merges \
              | grep "^feat:" | sed 's/^feat: /- /' || true)
            FIXES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s" --no-merges \
              | grep "^fix:" | sed 's/^fix: /- /' || true)
          fi

          {
            echo "body<<CHANGELOG_EOF"
            echo "## What's New in v${VERSION}"
            echo ""
            if [ -n "$FEATS" ]; then
              echo "### Features"
              echo "$FEATS"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo "$FIXES"
              echo ""
            fi
            if [ -z "$FEATS" ] && [ -z "$FIXES" ]; then
              echo "- Minor improvements and internal changes"
              echo ""
            fi
            echo "---"
            echo "Download the \`.dmg\` (macOS) or \`.exe\` / \`.msi\` (Windows) below to install."
            echo ""
            echo "**Already installed?** AgentHarbor will prompt you to update automatically."
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 20)

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Write Apple API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p $RUNNER_TEMP/private_keys
          echo "$APPLE_API_KEY_CONTENT" > $RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8" >> $GITHUB_ENV

      - name: Build, sign, notarize and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SKIP_VERSION_BUMP: '1'
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AgentHarbor ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false

      - name: Cleanup secrets
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain 2>/dev/null || true
          rm -f $RUNNER_TEMP/certificate.p12
          rm -rf $RUNNER_TEMP/private_keys

  release-windows:
    runs-on: windows-latest
    needs: release-macos
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SKIP_VERSION_BUMP: '1'
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AgentHarbor ${{ github.ref_name }}'
          releaseBody: ${{ needs.release-macos.outputs.changelog }}
          releaseDraft: false
          prerelease: false

  finalize:
    runs-on: ubuntu-latest
    needs: [release-macos, release-windows]
    permissions:
      contents: write

    steps:
      - name: Download sig files from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir sigs
          gh release download "$TAG" \
            --repo abhiunix/AgentHarbor \
            --pattern "*.sig" \
            --dir sigs/

      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          MACOS_SIG=$(cat sigs/AgentHarbor_aarch64.app.tar.gz.sig)

          WINDOWS_SIG_FILE=$(find sigs -name "*_x64-setup.exe.sig" | head -1)
          WINDOWS_SIG=$(cat "$WINDOWS_SIG_FILE")

          jq -n \
            --arg version "$VERSION" \
            --arg macos_sig "$MACOS_SIG" \
            --arg windows_sig "$WINDOWS_SIG" \
            --arg tag "$TAG" \
            --arg pub_date "$PUB_DATE" \
            '{
              version: $version,
              notes: ("See https://github.com/abhiunix/AgentHarbor/releases/tag/" + $tag + " for details."),
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  signature: $macos_sig,
                  url: ("https://github.com/abhiunix/AgentHarbor/releases/download/" + $tag + "/AgentHarbor_aarch64.app.tar.gz")
                },
                "windows-x86_64": {
                  signature: $windows_sig,
                  url: ("https://github.com/abhiunix/AgentHarbor/releases/download/" + $tag + "/AgentHarbor_" + $version + "_x64-setup.exe")
                }
              }
            }' > latest.json

          gh release upload "$TAG" latest.json \
            --repo abhiunix/AgentHarbor \
            --clobber

name: Refresh star history chart

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/star-history.mjs
      - name: Commit if changed
        run: |
          if ! git diff --quiet docs/assets/star-history.svg docs/assets/star-history-dark.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/assets/star-history.svg docs/assets/star-history-dark.svg
            git commit -m "chore: refresh star history chart [skip ci]"
            git push
          fi

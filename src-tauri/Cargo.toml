[package]
name = "agentharbor"
version = "1.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentharbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
zip = "0.6"
flate2 = "1.0"
tar = "0.4"
tokio = { version = "1", features = ["sync", "time", "rt"] }
lazy_static = "1.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dunce = "1"
which = "7"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
libc = "0.2"
whoami = "1"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
getrandom = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Dev-build Dock icon (see set_dev_dock_icon); versions match tauri's own tree.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[dev-dependencies]
tempfile = "3"


# Optimize dependencies in dev builds (serde_json/chrono parse 402MB+ of
# session JSONLs; opt-level 0 makes analytics 10-30x slower than release).
# Our own crate stays at opt-level 0 for fast incremental compiles.
[profile.dev.package."*"]
opt-level = 2
